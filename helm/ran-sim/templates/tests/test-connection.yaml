apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ran-sim.fullname" . }}-test"
  labels:
    {{- include "ran-sim.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.8.0
      command: ["curl"]
      args:
        - "--fail"
        - "http://{{ include "ran-sim.fullname" . }}:{{ .Values.service.port }}/healthz"
