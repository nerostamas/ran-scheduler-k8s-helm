apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ran-sim.fullname" . }}
  labels:
    {{- include "ran-sim.labels" . | nindent 4 }}
data:
  SIM_UES: {{ .Values.simDefaults.ues | quote }}
  SIM_RBS: {{ .Values.simDefaults.rbs | quote }}
  SIM_TTIS: {{ .Values.simDefaults.ttis | quote }}
  SIM_SEED: {{ .Values.simDefaults.seed | quote }}
  SIM_SCHEDULER: {{ .Values.simDefaults.scheduler | quote }}
