name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke:
    name: build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ curl
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: Build + smoke test endpoints
        run: ./scripts/smoke-test.sh

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ran-sim-service:ci .

  helm:
    name: helm lint & manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: helm lint
        run: helm lint ./helm/ran-sim
      - name: Render manifests
        run: helm template ran-sim ./helm/ran-sim > /tmp/rendered.yaml
      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate rendered manifests
        run: |
          kubeconform -strict -summary \
            -skip ServiceMonitor \
            -schema-location default \
            /tmp/rendered.yaml
      - name: Render with autoscaling + servicemonitor enabled
        run: |
          helm template ran-sim ./helm/ran-sim \
            --set autoscaling.enabled=true \
            --set serviceMonitor.enabled=true \
            --set replicaCount=3 > /tmp/rendered-full.yaml
          kubeconform -strict -summary -skip ServiceMonitor \
            -schema-location default /tmp/rendered-full.yaml
